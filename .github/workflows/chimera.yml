name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# No X68000 firmware or game is ours to put on a public runner, so the gate
# here proves what it can without them: the native reference and the package
# build, fresh, from the pinned MAME with the patch series applied, the
# declarations hold together, and the package passes Chimera's own contract
# tests. Its summary says which machine legs were skipped. Those legs run
# where the firmware is (tests/roms-local or X68K_ROMS), before anything is
# pushed.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref: the nightly schedule and a push to
# main would otherwise cancel each other, and the publish that depends on the
# cancelled gate is then skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: gate (package, declaration, Chimera contract)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Check out the part of MAME the core builds
        # waterbox/mame-sparse.txt at the pinned commit: blobless, sparse,
        # depth 1 - the X68000's driver, the devices, the emulator and the
        # third-party code they need, not MAME's other machines.
        run: ./waterbox/checkout-mame.sh

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 mono-complete xvfb libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera native dependencies
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the Chimera solution
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Core gate (builds MAME twice and the package)
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
        run: ./waterbox/run-gate.sh

      - name: Install the package into the Chimera checkout
        run: |
          mkdir -p chimera-checkout/build/Cores
          cp build/package/x68k.chimeraCore chimera-checkout/build/Cores/

      - name: The package through the real frontend
        # Chimera's own contract tests, run against THIS package: readable,
        # built for an ABI this frontend runs, a working factory, binding only
        # buttons its controller declares, stamping a version.
        working-directory: chimera-checkout
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: |
          dotnet test source/gui/Chimera.Tests.Client.Common/Chimera.Tests.Client.Common.csproj \
            -c Release --nologo \
            --filter "FullyQualifiedName~InstalledCorePackagesTests|FullyQualifiedName~MnemonicUniquenessTests"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: x68k-${{ github.sha }}
          path: chimera-checkout/build/Cores/x68k.chimeraCore
          if-no-files-found: error

      - name: Upload the gate work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-work
          path: build/gate/

  publish:
    # What the gate passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. The logic is Chimera's tools/publish-core.sh, through
    # the one reusable workflow every core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: x68k
      artifact: x68k-${{ github.sha }}
      package: x68k.chimeraCore
      kind: ${{ github.event.inputs.kind }}
